[package]
name = "dice_nom_shim"
version = "0.1.0"
edition = "2021"
authors = ["G Palmer <palmergs@gmail.com>"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.8" }
rb-sys = { version = "0.9", default-features = false, features = ["stable-api-compiled-fallback"] }
dice-nom = "0.5"
rand = "0.9"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
